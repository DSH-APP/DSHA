# dsh-destructive-guard bundle patch：提供明确的审批档位；强制工具策略属于签名 ToolRuntime。
# profile 禁用此插件或热重载不移除 ToolRuntime 的执行前/最终分派核验。
#
# 为什么必须动审批策略（否则守卫形同虚设）：
#   dsh-base 按 `DSH_PERMISSION_MODE` 推导审批策略 —— danger-full-access ⇒ policy=never
#   （dsh-base/cordis.patch.yml:248）。而 ApprovalService.decide() 在 never 下**在弹窗之前**
#   就返回 rejected（dsh-user-approval/lib/index.js:175），所以任何 ask 都到不了用户面前。
#   普通 bash 没有按删除文本请求审批；never 的 rejected 本身并不授权执行。
#   这里把策略固定成 ask；沙箱模式**不动**（仍由环境变量决定 danger-full-access），
#   文件访问能力与之前完全一致，多出来的只有"会问"这一件事。
#
# 为什么还要补 preset：
#   approval 变 ask 之后，"沙箱全开 + 会问"这个组合不在 dsh-base 的三档里，而
#   permission-presets 在构造时用 derive() 推导默认档位，推导不出就直接抛错
#   （dsh-permission-presets/lib/index.js:180）。所以显式补一档并把它设为默认。
#   danger-full-access 这一档仍是 approval=never；只有当前会话明确选择此档、
#   sandbox 与 approval 服务同时确认时，免本守卫的网页审批；执行身份核验仍保留。
#
# defaultPreset 必须跟着 `DSH_PERMISSION_MODE` 走：新会话的沙箱档位是从默认 preset
# 的 spec 里 pin 下去的（dsh-permission-presets/lib/index.js:376 pinInitialPermission），
# 写死 guarded-full-access 会让用户选的 read-only / workspace-write 在**新会话**上失效。
#
# 而且默认值只能比 dsh-base 更严、绝不能更宽：dsh-base 对未设/空值/非法值都退回
# workspace-write（`DSH_PERMISSION_MODE ?? 'workspace-write'`），这里必须同样退回
# workspace-write，而不是掉进全盘可写那一档。只有显式 danger-full-access 才映射到
# guarded-full-access（沙箱同样是全盘可写，但破坏性命令要问）。
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: !!js "((process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'read-only') ? 'read-only' : (((process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access') ? 'guarded-full-access' : 'workspace-write')"
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: read-only
        description: Read-only; actions that need approval still ask.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace and permitted temp directories; wider retries require approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Full agent file and command access without web approval prompts; native and system permissions still apply.
      guarded-full-access:
        sandbox: danger-full-access
        approval: ask
        name: 历史权限配置
        description: 仅兼容读取已保存的会话和默认值，不再作为新选项；DSHA 安全确认由设备页的全局权限控制。
- insert:
  - id: destructive-guard
    name: 'dsh-destructive-guard'

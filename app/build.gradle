plugins {
    id 'com.android.application'
}

// DSHA 官方发行版（单一 Standard 变体）：Android 11（API 30）及以上；发布身份见下方 dsha.identity。
// 旧 low/GeckoView 兼容线与独立上岛包都已移除：上岛能力并入正式包。
// 文件名独立于可诊断版本名，保持当前用户下载入口不变。
ext.dshaApkNameVersion = '0.2.2-rc.1'
def bundledTools = new groovy.json.JsonSlurper().parse(rootProject.file('tools/runtime-tools.lock.json'))
if (bundledTools.schema != 1 || !(bundledTools.pnpm.version ==~ /[0-9]+\.[0-9]+\.[0-9]+/))
    throw new GradleException('随包工具身份格式错误')
// BEGIN DSHA_BUNDLED_DSH_VERSION_GATE
// Read during configuration too: assemble/package/test must reject a mixed native/asset generation.
def verifyBundledDshGeneration = {
    def manifest = new groovy.json.JsonSlurper().parse(rootProject.file('tools/dsh-runtime/package.json'))
    def lock = new groovy.json.JsonSlurper().parse(rootProject.file('tools/dsh-runtime/package-lock.json'))
    def registry = new groovy.json.JsonSlurper().parse(file('src/main/assets/runtime-patches.json'))
    def source = file('src/main/java/com/deepseekharness/app/util/Constants.java').getText('UTF-8')
    def declarations = (source =~ /(?m)^\s*public static final String DSH_VERSION = "([^"\r\n]+)";\s*$/)
    if (declarations.count != 1)
        throw new GradleException('BUNDLED_DSH_NATIVE_VERSION_ANCHOR')
    def version = manifest.dependencies['@deepseek-ai/dsh']
    if (!(version instanceof String) || !(version ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/)
            || manifest.version != version || lock.version != version
            || lock.packages[''].version != version
            || lock.packages[''].dependencies['@deepseek-ai/dsh'] != version
            || lock.packages['node_modules/@deepseek-ai/dsh'].version != version
            || registry.schema != 1 || registry.dshVersion != version
            || declarations[0][1] != version)
        throw new GradleException('BUNDLED_DSH_VERSION_MISMATCH: native, npm lock and signed patch registry must agree')
}
verifyBundledDshGeneration()
def verifyBundledDshVersion = tasks.register('verifyBundledDshVersion') {
    inputs.files(rootProject.files('tools/dsh-runtime/package.json', 'tools/dsh-runtime/package-lock.json'))
    inputs.files(file('src/main/assets/runtime-patches.json'),
            file('src/main/java/com/deepseekharness/app/util/Constants.java'))
    doLast { verifyBundledDshGeneration() }
}
// END DSHA_BUNDLED_DSH_VERSION_GATE
// CI 只生成未签名完整包；该产物不得进入 release 或覆盖安装。
def unsignedPackage = project.findProperty('dsha.unsignedPackage') == 'true'
// 测试包变体：显式开关才改包名/版本名，与正式包共存且数据完全隔离；默认构建不变。
// .test 保留历史路径；.debug 是可调试的 debug 构建；.dev 是 release 构建的测试签名包。
// 三者互斥；正式包名仍只由 release-production 用正式证书构建。
def sunsetTest = project.findProperty('dsha.sunsetTest') == 'true' || System.getenv('DSHA_SUNSET_TEST') == '1'
def debugPackage = project.findProperty('dsha.debugPackage') == 'true' || System.getenv('DSHA_DEBUG_PACKAGE') == '1'
def devPackage = project.findProperty('dsha.devPackage') == 'true' || System.getenv('DSHA_DEV_PACKAGE') == '1'
if ((sunsetTest ? 1 : 0) + (debugPackage ? 1 : 0) + (devPackage ? 1 : 0) > 1)
    throw new GradleException('TEST_PACKAGE_VARIANT_CONFLICT: .test / .debug / .dev 只能选一个')
def testVariantLabel = debugPackage ? 'Debug' : devPackage ? 'Dev' : sunsetTest ? 'Test' : ''
// 发布身份：-Pdsha.identity=mod|upstream，默认 upstream（dsh.android.client / 历史 E7E3 证书，官方发行身份）。
// mod 是 io.github.sunsetrne.dsha / Mod 证书，保留用于历史包与共存安装验证，不再作为默认身份。
// 两套身份的包名、显示名、测试后缀、默认 key alias 与核对证书都从 ci/release-identity.<name>.json 读取；
// versionCode / versionName 共用。未知值直接失败，不回退到任一身份，签名身份绝不混用。
// 解析规则与 tools/release-identity.py 一致，由 tools/test-release-identity.py 交叉核对。
def releaseIdentityNames = ['mod', 'upstream']
def releaseIdentityName = (project.findProperty('dsha.identity') ?: 'upstream').toString()
if (!(releaseIdentityName in releaseIdentityNames))
    throw new GradleException("UNKNOWN_RELEASE_IDENTITY: dsha.identity 只接受 mod 或 upstream，收到 '${releaseIdentityName}'")
def releaseIdentityFile = rootProject.file("ci/release-identity.${releaseIdentityName}.json")
def releaseIdentity = new groovy.json.JsonSlurper().parse(releaseIdentityFile)
if (releaseIdentity.schema != 1 || releaseIdentity.identity != releaseIdentityName
        || !(releaseIdentity.packageName ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)
        || !(releaseIdentity.certificateSha256 ==~ /[a-f0-9]{64}/)
        || !(releaseIdentity.testSuffix ==~ /\.[A-Za-z][A-Za-z0-9_]*/)
        || !(releaseIdentity.devSuffix ==~ /\.[A-Za-z][A-Za-z0-9_]*/)
        || !(releaseIdentity.keyAlias ==~ /[A-Za-z0-9._-]+/)
        || !(releaseIdentity.appName instanceof String) || releaseIdentity.appName.trim().isEmpty())
    throw new GradleException("RELEASE_IDENTITY_INVALID: ${releaseIdentityFile}")
ext.dshaReleaseIdentity = releaseIdentity
// 只有源码 CI 可显式允许缺少真实测试夹具；完整测试默认要求固定输入齐备。
def sourceOnlyTests = providers.gradleProperty('dsha.sourceOnlyTests').orElse('false').get()
if (!(sourceOnlyTests in ['true', 'false']))
    throw new GradleException('dsha.sourceOnlyTests 只接受 true 或 false')

android {
    namespace 'com.deepseekharness.app'
    compileSdk {
        version = release(37)
    }
    ndkVersion '26.3.11579264'

    defaultConfig {
        // 包名随发布身份：mod = io.github.sunsetrne.dsha（与原版完全隔离，可并行安装），
        // upstream = dsh.android.client（只能用历史 E7E3 证书覆盖升级）。
        applicationId releaseIdentity.packageName
        minSdk 30
        targetSdk 37
        buildConfigField 'String', 'BUNDLED_PNPM_VERSION', '"' + bundledTools.pnpm.version + '"'
        // 测试包标记：只有显式测试变体（.test/.debug/.dev）为 true。正式包恒为 false，
        // 用于只在测试包显示「反馈与诊断」导出入口；不得改为运行时猜测包名。
        buildConfigField 'boolean', 'TEST_PACKAGE', (sunsetTest || debugPackage || devPackage) ? 'true' : 'false'
        // 上岛能力已并入正式包；不再有独立上岛包名或独立显示名。
        // 显示名随发布身份（DSH-A-Su / DSHA）；测试变体加后缀，便于桌面上区分两个包。
        resValue 'string', 'app_name', testVariantLabel ? releaseIdentity.appName + ' ' + testVariantLabel : releaseIdentity.appName
        versionCode 356
        // DSHA 修订号 + 固定的北京时间戳 + 内置 DSH 版本；同一交付重建不变。
        versionName "0.2.2-rc.1-20261111.0100-dsh0.2.2-rc.1"
        testInstrumentationRunner project.findProperty('dsha.testRunner') ?: "com.deepseekharness.app.Rc13Instrumentation"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 只保留 Standard 一条线（Android 11 / API 30+）。low 兼容线与 GeckoView 已整体删除。
    flavorDimensions 'androidSupport'
    productFlavors {
        standard {
            dimension 'androidSupport'
            minSdk 30
            if (sunsetTest) {
                // mod = .test，upstream = .SunsetRNE（见身份文件 testSuffix）。
                applicationIdSuffix releaseIdentity.testSuffix
                // 测试包身份沿用历史 `-SunsetTest` 后缀：CI 与发布脚本按此核验，不能只写 `-test`。
                versionNameSuffix '-SunsetTest'
            } else if (devPackage) {
                // 开发环境测试包：mod = .dev，upstream = .SunsetDev（见身份文件 devSuffix）。
                applicationIdSuffix releaseIdentity.devSuffix
                versionNameSuffix '-SunsetDev'
            }
        }
    }

    signingConfigs {
        // mod 身份：DSH-A-Su Mod 发布签名 = 新建的 dsha-a-su-release.jks（alias dsha-a-su，
        // 证书 SHA-256 A4:B0:41:3C:67:FA:46:DD:30:DC:7E:2B:CE:3A:D5:61:51:ED:8B:FD:E2:A3:31:5F:FF:68:5B:AF:78:6B:5D:5D）。
        // io.github.sunsetrne.dsha 与原版 dsh.android.client 不存在覆盖安装关系，不使用历史 E7E3 证书。
        // upstream 身份：历史 E7E3 证书（alias androiddebugkey），私钥只在 ym2025szz/DSHA-prerelase 的 Secrets。
        // 期望的证书哈希记录在 ci/release-identity.<identity>.json，verifyPublishCertificate 会强制核对。
        // 正式任务必须明确提供所选身份的发布证书；单测/debug 不依赖发布密钥。
        publish {
            def ksPath = System.getenv("DSHA_KEYSTORE") ?: project.findProperty("dsha.keystore")
            if (ksPath != null && !ksPath.toString().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DSHA_KEYSTORE_PASSWORD")
                        ?: project.findProperty("dsha.keystore.password")
                keyAlias System.getenv("DSHA_KEY_ALIAS")
                        ?: project.findProperty("dsha.key.alias") ?: releaseIdentity.keyAlias
                keyPassword System.getenv("DSHA_KEY_PASSWORD")
                        ?: project.findProperty("dsha.key.password")
                if (!storePassword || !keyPassword)
                    throw new GradleException('必须明确提供发布密钥口令，不能使用隐式缺省值')
                println "签名：已配置 ${releaseIdentityName} 身份发布证书"
            } else {
                println "签名：未配置 ${releaseIdentityName} 身份发布证书；正式 APK 打包将被阻止"
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            if (debugPackage) {
                // 可调试的共存包：包名 .debug；CI 用测试证书签名，产物仅用于开发环境。
                applicationIdSuffix '.debug'
                versionNameSuffix '-SunsetDebug'
                // 统一先出 unsigned APK，再由 CI 用测试证书签名，避免 runner 一次性 debug 证书。
                if (unsignedPackage) signingConfig null
            }
        }
        release {
            minifyEnabled false
            if (!unsignedPackage) signingConfig signingConfigs.publish
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // 应急启动器按签名 APK 中的完整字节校验，禁止打包阶段再改写这两份 ELF。
            keepDebugSymbols += ['**/libproot.so', '**/libprootloader.so']
            // 使用 app 自带的同版本 16 KB JNI，覆盖 terminal-emulator AAR 中的旧库。
            pickFirsts += ['**/libtermux.so']
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi/**', '**/armeabi-v7a/**']
        }
        resources {
            // bcprov 只被备份用到 AES-GCM / SHA-256 / PBKDF2 轻量 API；Picnic 后量子常量表与
            // CertPathReviewer 文案只由应用从不调用的类加载，不进入 APK（压缩后约 1.2 MB）。
            excludes += ['/org/bouncycastle/pqc/legacy/picnic/**',
                         '/org/bouncycastle/x509/CertPathReviewerMessages*.properties']
        }
    }

    androidResources {
        // 'bin' 是离线 rootfs：aapt 会把 .tar.gz 静默解成 .tar，所以打包前改名 .bin，
        // 保持 STORED（不 deflate），避免对已经压缩的离线运行时再压缩一次。
        noCompress += ['gz', 'xz', 'bin', 'ja', 'tar', 'whl']
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues = true
        aidl = true
        buildConfig = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // 完整 Standard 套件在同一测试 JVM 内运行 2500+ 项，并包含 25MB 位图边界和
        // 多组 Robolectric 界面沙箱；默认堆上限会在与断言无关的位图分配处 OOM。
        // 这里只提高测试进程内存上限，不放宽或跳过任何用例。
        unitTests.all { it.maxHeapSize = '2048m' }
    }

    sourceSets {
        main.assets.setSrcDirs([layout.buildDirectory.dir("generated/standardAssets").get().asFile,
                layout.buildDirectory.dir("generated/recoveryAssets").get().asFile])
        main.java.srcDir(layout.buildDirectory.dir("generated/uiLanguage").get().asFile)
        // Both browser test entry points load one test-only HTML fixture.
        debug.assets.srcDir(rootProject.file("tools/fixtures/web-state"))
        androidTest.assets.srcDir(rootProject.file("tools/fixtures/web-state"))
    }
}

def verifyPublishCertificate = tasks.register("verifyPublishCertificate") {
    doLast {
        if (sunsetTest || debugPackage || devPackage)
            throw new GradleException('TEST_PACKAGE_REQUIRES_UNSIGNED: 测试包不能使用正式发布证书；请用 -Pdsha.unsignedPackage=true 由测试证书签名')
        def signing = android.signingConfigs.publish
        if (signing.storeFile == null || !signing.storeFile.isFile())
            throw new GradleException("正式 APK 缺少 ${releaseIdentityName} 身份发布密钥，停止打包")
        def store = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
        signing.storeFile.withInputStream { store.load(it, signing.storePassword.toCharArray()) }
        def certificate = store.getCertificate(signing.keyAlias)
        def identityFile = "ci/release-identity.${releaseIdentityName}.json"
        def identity = new groovy.json.JsonSlurper().parse(rootProject.file(identityFile))
        def expected = identity.certificateSha256
        if (certificate == null || java.security.MessageDigest.getInstance("SHA-256")
                .digest(certificate.encoded).encodeHex().toString() != expected)
            throw new GradleException("发布证书与 ${identityFile} 记录不符，停止打包")
        if (android.defaultConfig.applicationId != identity.packageName)
            throw new GradleException("applicationId 与 ${identityFile} 记录不符，停止打包")
    }
}
tasks.configureEach {
    if (!unsignedPackage && name.matches("(package|validateSigning|assemble)StandardRelease")) dependsOn(verifyPublishCertificate)
}
// 只读配置检查：打印解析出的发布身份，不读取密钥、不打包。
tasks.register('printReleaseIdentity') {
    def summary = "releaseIdentity=${releaseIdentityName} applicationId=${android.defaultConfig.applicationId}" +
            " appName=${releaseIdentity.appName} testSuffix=${releaseIdentity.testSuffix} devSuffix=${releaseIdentity.devSuffix}" +
            " testVariant=${testVariantLabel.isEmpty() ? 'release' : testVariantLabel.toLowerCase()}" +
            " keyAlias=${android.signingConfigs.publish.keyAlias ?: releaseIdentity.keyAlias}" +
            " certificateSha256=${releaseIdentity.certificateSha256}"
    doLast { println summary }
}
tasks.register('signPublishRelease') {
    if (!unsignedPackage) dependsOn(verifyPublishCertificate, 'assembleStandardRelease')
    doFirst {
        if (unsignedPackage) throw new GradleException('未签名 CI 模式不能执行正式发布任务')
    }
}

def verifyBundledIdentities = tasks.register('verifyBundledIdentities', Exec) {
    inputs.files(rootProject.files('tools/runtime-tools.lock.json', 'tools/prepare-runtime-tools.py',
            'app/src/main/assets/runtime-tools.json'))
    commandLine(System.getenv('DSHA_PYTHON') ?: 'python3', '-B',
            rootProject.file('tools/prepare-runtime-tools.py').absolutePath, '--check')
}
def verifyBuiltinRegistry = tasks.register('verifyBuiltinRegistry', Exec) {
    inputs.files(rootProject.files('tools/generate-builtin-plugins.py', 'app/src/main/assets/builtin-plugins.json',
            'app/src/main/java/com/deepseekharness/app/util/BuiltinPluginRegistry.java'))
    commandLine(System.getenv('DSHA_PYTHON') ?: 'python3', '-B',
            rootProject.file('tools/generate-builtin-plugins.py').absolutePath, '--verify')
}
def verifyCredentialRegistry = tasks.register('verifyCredentialRegistry', Exec) {
    inputs.files(rootProject.files('tools/generate-credential-paths.py', 'app/src/main/assets/credential-paths.json',
            'app/src/main/java/com/deepseekharness/app/util/CredentialPathRules.java'))
    commandLine(System.getenv('DSHA_PYTHON') ?: 'python3', '-B',
            rootProject.file('tools/generate-credential-paths.py').absolutePath, '--check')
}
def verifyProrootCompat = tasks.register('verifyProrootCompat', Exec) {
    inputs.files(rootProject.files('tools/test-proroot-compat.py',
            'tools/proroot-compat/stack-sysconf.c', 'tools/proroot-compat/abi.lock.json',
            'tools/proroot-compat/build.py', 'tools/proroot-compat/linker-entry.c'))
    inputs.files(fileTree('src/main/jniLibs') { include '**/libproroot*.so', '**/libdsha-proroot*.so' })
    commandLine(System.getenv('DSHA_PYTHON') ?: 'python3', '-B',
            rootProject.file('tools/test-proroot-compat.py').absolutePath)
}
def verifyCurrentChangelog = tasks.register('verifyCurrentChangelog', Exec) {
    inputs.file(file('build.gradle'))
    inputs.files(rootProject.files('tools/generate-changelog.py', 'tools/source_text.py',
            'tools/ui_language_catalog.py'))
    ['zh', 'zh-Hant', 'en', 'ru', 'ja', 'ko', 'ar', 'pt', 'la', 'fr'].each { language ->
        inputs.file(rootProject.file("docs/releases/build${android.defaultConfig.versionCode}-changes.${language}.md"))
    }
    inputs.files(fileTree('src/main/res') { include 'raw*/changelog.md' })
    commandLine(System.getenv('DSHA_PYTHON') ?: 'python3', '-B',
            rootProject.file('tools/generate-changelog.py').absolutePath, '--check')
}

tasks.named('preBuild').configure { dependsOn(verifyBundledIdentities, verifyBuiltinRegistry, verifyCredentialRegistry, verifyBundledDshVersion, verifyProrootCompat, verifyCurrentChangelog) }

def verifyWebLanguages = tasks.register('verifyWebLanguages', Exec) {
    inputs.files(rootProject.files('tools/prepare-web-languages.py', 'tools/web_language_catalog.py',
            'tools/source_text.py', 'tools/ui_language_catalog.py',
            'tools/i18n/web-messages.json', 'tools/i18n/web-language-bridge.js'))
    inputs.files(rootProject.fileTree('tools/i18n/web-translations') { include '*.json' })
    inputs.files(files('src/main/assets/web-integration/language.js',
            'src/main/assets/language-patch.json',
            'src/main/assets/recovery-recipes/0.2.2-rc.1/language-patch.json'))
    commandLine(System.getenv('DSHA_PYTHON') ?: 'python3', '-B',
            rootProject.file('tools/prepare-web-languages.py').absolutePath,
            '--catalog-only', '--check')
}

tasks.named('preBuild').configure { dependsOn(verifyWebLanguages) }

tasks.withType(Test).configureEach {
    systemProperty 'dsha.assetsDir', file('src/main/assets').absolutePath
    systemProperty 'dsha.sourceOnlyTests', sourceOnlyTests
    // 切换到完整测试时不得复用 source-only 的跳过结果。
    inputs.property 'dsha.sourceOnlyTests', sourceOnlyTests
}
tasks.configureEach {
    if (name in ['verifyBundledIdentities', 'verifyBuiltinRegistry', 'prepareStandardAssets',
                 'prepareBackupAssets', 'prepareRuntimeDescriptor', 'prepareRecoveryAssets', 'prepareUiLanguages'])
        inputs.file(rootProject.file('tools/source_text.py'))
}

def prepareStandardAssets = tasks.register("prepareStandardAssets", Exec) {
    inputs.dir("src/main/assets")
    inputs.file(rootProject.file("tools/prepare-standard-assets.py"))
    inputs.file(rootProject.file("tools/generated_asset_directory.py"))
    inputs.files(rootProject.files("tools/asset-deployment.json", "tools/asset_deployment.py", "tools/verify-asset-deployment.py"))
    inputs.file(rootProject.file("tools/prepare-web-compat.mjs"))
    inputs.files(rootProject.files("tools/web-compat/entry.cjs", "tools/web-compat/package.json", "tools/web-compat/package-lock.json"))
    inputs.file(rootProject.file("tools/build-dsh-runtime.py"))
    inputs.files(rootProject.files("tools/runtime_stable_patches.py", "tools/runtime_input_contract.py"))
    inputs.dir(rootProject.file("tools/dsh-runtime"))
    inputs.file(rootProject.file("tools/prepare-ubuntu-tools.py"))
    inputs.dir(rootProject.file("tools/ubuntu-tools"))
    inputs.file(rootProject.file("tools/prepare-gh-cli.py"))
    inputs.files(rootProject.files("tools/gh-cli/packages.lock.json"))
    outputs.dir(layout.buildDirectory.dir("generated/standardAssets"))
    outputs.file(layout.buildDirectory.file("generated/standard-assets-report.json"))
    commandLine(System.getenv("DSHA_PYTHON") ?: "python3", "-B",

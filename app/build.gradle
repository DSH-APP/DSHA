dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'com.google.android.material:material:1.11.0'
    standardImplementation 'dev.rikka.shizuku:api:13.1.5'
    standardImplementation 'dev.rikka.shizuku:provider:13.1.5'
    // 真 PTY 终端：Termux 拆出的 terminal-view/terminal-emulator（Apache 2.0），
    // 自带 JNI PTY 层（openpty+fork/exec）。坐标是 JitPack 多模块真实 groupId
    // （com.termux.termux-app），不是 Wiki 上会 401 的 com.termux:terminal-view。
    implementation('com.termux.termux-app:terminal-view:0.118.0') {
        // Fixed 0.118.0 emulator sources are vendored with the bounded input queue fix.
        exclude group: 'com.termux.termux-app', module: 'terminal-emulator'
    }
    // 宿主备份：流式 JSON 清单与跨 API 23 的 PBKDF2-SHA256 / AES-GCM 实现，版本锁定。
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.85.2'
    // 宿主凭据 YAML 仅使用 data-only SafeConstructor；来源、JAR 和许可由备份锁核验。
    implementation 'org.yaml:snakeyaml:2.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}

tasks.withType(Test).configureEach {
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    def frameworkDirectory = System.getenv('DSHA_ROBOLECTRIC_DEPENDENCY_DIR')
    if (frameworkDirectory) {
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', frameworkDirectory
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dsha.cc www.dsha.cc;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://dsha.cc$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dsha.cc;
    ssl_certificate /etc/letsencrypt/live/dsha.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsha.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://dsha.cc$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dsha.cc;
    root /srv/dsha.cc/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dsha.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsha.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DSHA_TLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { expires -1; try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location ~* \.(?:apk|tar\.gz)$ {
        types { application/vnd.android.package-archive apk; application/gzip gz; }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        # A location with add_header does not inherit the server's headers.
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location /api/ { expires -1; try_files $uri =404; }
    location = /health.json { expires -1; try_files $uri =404; }
    location = /.well-known/assetlinks.json { default_type application/json; expires -1; try_files $uri =404; }
}

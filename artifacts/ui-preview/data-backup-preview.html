<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSHA · 数据与备份 重构预览</title>
<style>
  /* 颜色取自 app/src/main/res/values/colors.xml，夜间为预览近似值 */
  :root {
    --primary: #1E50D0; --primary-dark: #1A46B8; --on-primary: #fff;
    --surface: #F3F6FB; --card: #FCFDFF; --raised: #E7EDF6;
    --line: rgba(19,29,58,.12); --line-strong: #C6D2E4;
    --text: #18273F; --text2: #50617A; --muted: #5A6B86;
    --accent-bg: #E8EFFF; --accent-soft: #DBE7FF;
    --ok: #287453; --ok-bg: #E4F3EB; --warn: #8C600D; --warn-bg: #FCF3DE;
    --err: #AF404B; --err-bg: #FBEBEC;
    --radius: 18px; --shadow: 0 1px 2px rgba(19,29,58,.05);
    font-family: "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --primary: #8FB0FF; --primary-dark: #A9C2FF; --on-primary: #0B1630;
    --surface: #0F1522; --card: #161E2E; --raised: #1F2A3D;
    --line: rgba(200,215,240,.12); --line-strong: #2E3B53;
    --text: #E4E9F2; --text2: #A7B3C7; --muted: #8B98AE;
    --accent-bg: #1D2B4A; --accent-soft: #23345A;
    --ok: #7FD1A6; --ok-bg: #173327; --warn: #E9C171; --warn-bg: #3A2E14;
    --err: #F19AA3; --err-bg: #3D1E23;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #D9DFEA; color: var(--text); }
  [data-theme="dark"] body { background: #05080F; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- 预览外壳 ---------- */
  .stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: rgba(255,255,255,.85);
    border-radius: 14px; padding: 8px 12px; font-size: 13px; color: #18273F; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  [data-theme="dark"] .toolbar { background: rgba(30,40,60,.9); color: #E4E9F2; }
  .toolbar label { display: flex; gap: 6px; align-items: center; }
  .toolbar select, .toolbar button { font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid #C6D2E4; background: #fff; color: #18273F; }
  .device { width: min(1280px, 100%); height: min(800px, calc(100vh - 90px)); min-height: 560px; background: var(--surface);
    border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(15,25,50,.25); position: relative; }
  .device.phone { width: 400px; height: min(820px, calc(100vh - 90px)); }

  /* ---------- 应用栏 ---------- */
  .appbar { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); flex: none; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-bg); display: grid; place-items: center; color: var(--primary); }
  .appbar h1 { margin: 0; font-size: 19px; letter-spacing: .5px; }
  .appbar small { color: var(--text2); font-size: 12px; }
  .appbar .sp { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--text); }
  .icon-btn:hover { background: var(--raised); }

  .body { flex: 1; display: flex; min-height: 0; }
  .rail { width: 92px; flex: none; border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 10px; }
  .rail button { border: 0; background: transparent; border-radius: 16px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--primary); cursor: pointer; }
  .rail button.on { background: var(--accent-bg); }
  .rail .foot { margin-top: auto; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-align: center; }
  .list { width: 340px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 22px 22px 40px; }
  .list h2 { font-size: 28px; margin: 0 0 6px; }
  .detail { flex: 1; overflow: auto; position: relative; }
  .detail-inner { max-width: 760px; margin: 0 auto; padding: 22px 28px 60px; }
  .phone .rail, .phone .appbar .hide-phone { display: none; }
  .phone .list { display: none; }
  .phone .detail-inner { padding: 16px 16px 60px; }
  @media (max-width: 760px) { .device:not(.phone) .list { display: none; } .device:not(.phone) .rail { width: 72px; } }

  /* ---------- 通用组件 ---------- */
  .muted { color: var(--text2); }
  .cap { font-size: 12px; color: var(--muted); }
  .section-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--text2); margin: 22px 4px 10px; }
  .section-label svg { color: var(--primary); }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; min-height: 68px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--raised); }
  .row.sel { background: var(--accent-bg); }
  .row[disabled] { opacity: .45; cursor: not-allowed; }
  .row .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-bg); color: var(--primary); display: grid; place-items: center; flex: none; }
  .row .ic.warn { background: var(--warn-bg); color: var(--warn); }
  .row .ic.err { background: var(--err-bg); color: var(--err); }
  .row .tx { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; font-size: 15px; }
  .row .s { font-size: 13px; color: var(--text2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chev { color: var(--muted); flex: none; }
  .btn { border: 1px solid var(--line-strong); background: var(--card); color: var(--primary); border-radius: 14px; padding: 11px 18px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
  .btn:hover { background: var(--accent-bg); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns.full > .btn { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-bg); color: var(--primary); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.err { background: var(--err-bg); color: var(--err); }
  .badge.gray { background: var(--raised); color: var(--text2); }
  .notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--raised); font-size: 13px; color: var(--text2); line-height: 1.6; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .notice.err { background: var(--err-bg); color: var(--err); }
  .notice svg { flex: none; margin-top: 2px; }

  /* 页面头 */
  .page-head { display: flex; align-items: center; gap: 16px; margin: 6px 0 4px; }
  .page-head .big-ic { width: 60px; height: 60px; border-radius: 18px; background: var(--accent-bg); color: var(--primary); display: grid; place-items: center; flex: none; }
  .page-head h2 { margin: 0; font-size: 30px; }
  .page-sub { margin: 8px 0 0; color: var(--text2); font-size: 14px; }
  .crumb { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--text2); }
  .crumb button { border: 0; background: transparent; color: var(--primary); cursor: pointer; padding: 6px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px; }
  .crumb button:hover { background: var(--accent-bg); }

  /* 状态卡（新首页核心） */
  .hero { border-radius: 22px; padding: 20px; background: linear-gradient(0deg, var(--card), var(--card)); border: 1px solid var(--line); margin-top: 18px; box-shadow: var(--shadow); }
  .hero-top { display: flex; gap: 14px; align-items: flex-start; }
  .shield { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--ok-bg); color: var(--ok); }
  .shield.warn { background: var(--warn-bg); color: var(--warn); }
  .shield.err { background: var(--err-bg); color: var(--err); }
  .shield.run { background: var(--accent-bg); color: var(--primary); }
  .hero h3 { margin: 2px 0 4px; font-size: 19px; }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stat { background: var(--surface); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 14px; margin-top: 3px; }
  .phone .hero-stats { grid-template-columns: 1fr; }
  .progress { height: 8px; border-radius: 99px; background: var(--raised); overflow: hidden; margin: 14px 0 8px; }
  .progress i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .4s; }
  .steps { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 8px; font-size: 13px; }
  .steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .steps li.done { color: var(--ok); }
  .steps li.cur { color: var(--primary); font-weight: 600; }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; flex: none; }
  .steps li.done .dot { background: currentColor; }
  .steps li.done .dot::after { content: ""; width: 7px; height: 4px; border-left: 2px solid var(--card); border-bottom: 2px solid var(--card); transform: rotate(-45deg) translate(1px,-1px); }
  .steps li.cur .dot { border-top-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 向导 stepper */
  .stepper { display: flex; gap: 6px; margin: 18px 0; }
  .stepper div { flex: 1; font-size: 12px; color: var(--muted); }
  .stepper div::before { content: ""; display: block; height: 4px; border-radius: 4px; background: var(--raised); margin-bottom: 6px; }
  .stepper div.on { color: var(--primary); font-weight: 600; }
  .stepper div.on::before, .stepper div.done::before { background: var(--primary); }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
  .kv dt { color: var(--text2); }
  .kv dd { margin: 0; }
  .incl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .phone .incl { grid-template-columns: 1fr; }
  .incl ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.9; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; cursor: pointer; }
  .check:hover { background: var(--raised); }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
  .check .s { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .seg { display: flex; background: var(--raised); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 11px; cursor: pointer; font-size: 13px; color: var(--text2); }
  .seg button.on { background: var(--card); color: var(--primary); font-weight: 700; box-shadow: var(--shadow); }
  .field { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 14px; }
  .field input { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); width: 130px; }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-strong); transition: .2s; }
  .switch span::after { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }

  .usage { display: flex; height: 18px; border-radius: 9px; overflow: hidden; margin: 14px 0; }
  .usage i { display: block; height: 100%; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; font-size: 13px; }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend b { margin-left: auto; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .chip { border: 1px solid var(--line-strong); background: var(--card); padding: 7px 14px; border-radius: 99px; font-size: 13px; cursor: pointer; color: var(--text2); }
  .chip.on { background: var(--accent-bg); border-color: var(--primary); color: var(--primary); font-weight: 600; }
  details.qa { border-top: 1px solid var(--line); padding: 4px 0; }
  details.qa:first-of-type { border-top: 0; }
  details.qa summary { cursor: pointer; padding: 12px 4px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.qa summary::after { content: "+"; color: var(--muted); }
  details.qa[open] summary::after { content: "−"; }
  details.qa p { margin: 0 4px 12px; font-size: 14px; color: var(--text2); line-height: 1.7; }
  .drop { border: 2px dashed var(--line-strong); border-radius: 18px; padding: 26px; text-align: center; color: var(--text2); cursor: pointer; background: transparent; width: 100%; }
  .drop:hover { border-color: var(--primary); color: var(--primary); }

  /* 弹层 */
  .scrim { position: absolute; inset: 0; background: rgba(9,16,30,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .scrim.show { display: flex; }
  .dialog { background: var(--card); border-radius: 24px; width: min(460px, 100%); max-height: 86%; overflow: auto; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .dialog h3 { margin: 0 0 10px; font-size: 19px; }
  .dialog p { margin: 0 0 18px; line-height: 1.7; color: var(--text2); font-size: 14px; white-space: pre-line; }
  .dialog .btns { justify-content: flex-end; }
  .toast { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #18273F; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .note-pin { position: fixed; right: 16px; bottom: 16px; max-width: 320px; font-size: 12px; background: #fff; color: #18273F; border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15); line-height: 1.6; }
  .note-pin b { display: block; margin-bottom: 4px; }
  .note-pin.hidden { display: none; }
  @media (max-width: 1100px) { .note-pin { display: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="toolbar" role="group" aria-label="预览控制">
    <strong>预览控制</strong>
    <label>设备
      <select id="ctl-device"><option value="tablet">平板双栏</option><option value="phone">手机单栏</option></select>
    </label>
    <label>备份状态
      <select id="ctl-state">
        <option value="ok">已保护</option>
        <option value="stale">较久未备份</option>
        <option value="never">从未备份</option>
        <option value="failed">上次失败</option>
        <option value="pending">维护未完成</option>
      </select>
    </label>
    <button id="ctl-theme" type="button">切换日夜</button>
    <button id="ctl-note" type="button">改动说明</button>
  </div>

  <div class="device" id="device">
    <header class="appbar">
      <div class="logo" aria-hidden="true"><svg width="24" height="24"><use href="#i-term"/></svg></div>
      <div><h1>DSH-A-Su Test</h1><small>偏好与管理</small></div>
      <div class="sp"></div>
      <button class="icon-btn hide-phone" aria-label="更新"><svg width="22" height="22"><use href="#i-down"/></svg></button>
      <button class="icon-btn" aria-label="切换日夜" data-action="theme"><svg width="22" height="22"><use href="#i-contrast"/></svg></button>
      <button class="icon-btn hide-phone" aria-label="关于"><svg width="22" height="22"><use href="#i-info"/></svg></button>
    </header>
    <div class="body">
      <nav class="rail" aria-label="主导航">
        <button><svg width="24" height="24"><use href="#i-play"/></svg>启动</button>
        <button><svg width="24" height="24"><use href="#i-puzzle"/></svg>插件</button>
        <button class="on" aria-current="page"><svg width="24" height="24"><use href="#i-gear"/></svg>设置</button>
        <button><svg width="24" height="24"><use href="#i-term"/></svg>终端</button>
        <div class="foot">LOCAL FIRST</div>
      </nav>
      <aside class="list" aria-label="设置分类">
        <h2>设置</h2>
        <p class="muted" style="margin:0 0 18px">让工作台按你的习惯运行。</p>
        <div class="section-label">运行环境</div>
        <div class="group">
          <button class="row"><span class="ic"><svg width="22" height="22"><use href="#i-box"/></svg></span><span class="tx"><div class="t">安装与环境</div><div class="s">安装与修复运行环境</div></span><svg class="chev" width="18" height="18"><use href="#i-chev"/></svg></button>
          <button class="row"><span class="ic"><svg width="22" height="22"><use href="#i-gear"/></svg></span><span class="tx"><div class="t">运行配置</div><div class="s">接口、显示与运行</div></span><svg class="chev" width="18" height="18"><use href="#i-chev"/></svg></button>
          <button class="row sel" data-go="root"><span class="ic"><svg width="22" height="22"><use href="#i-folder"/></svg></span><span class="tx"><div class="t">数据与备份</div><div class="s" id="list-sub">已保护 · 2 小时前</div></span><svg class="chev" width="18" height="18"><use href="#i-chev"/></svg></button>
          <button class="row"><span class="ic"><svg width="22" height="22"><use href="#i-shield"/></svg></span><span class="tx"><div class="t">设备能力授权</div><div class="s">Root · Shizuku · ADB · …</div></span><svg class="chev" width="18" height="18"><use href="#i-chev"/></svg></button>
          <button class="row"><span class="ic"><svg width="22" height="22"><use href="#i-box"/></svg></span><span class="tx"><div class="t">任务状态上岛</div><div class="s">状态栏胶囊 · 灵动岛 · 实时…</div></span><svg class="chev" width="18" height="18"><use href="#i-chev"/></svg></button>
        </div>
        <div class="section-label">使用体验</div>
        <div class="group">
          <button class="row"><span class="ic"><svg width="22" height="22"><use href="#i-globe"/></svg></span><span class="tx"><div class="t">语言 / Language</div><div class="s">跟随系统</div></span><svg class="chev" width="18" height="18"><use href="#i-chev"/></svg></button>
        </div>
      </aside>
      <main class="detail" id="detail" tabindex="-1" aria-live="polite"><div class="detail-inner" id="view"></div></main>
    </div>
    <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dialog" id="dialog"></div></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<div class="note-pin hidden" id="note">
  <b>这版改了什么</b>
  1. 顶部新增备份状态卡：最近备份、自动备份、保存位置一眼可见，主按钮就是「立即备份」。<br>
  2. 「一键备份」点击后先进确认页，列出包含 / 不包含的内容，不再直接开始。<br>
  3. 原「恢复与更多备份选项」拆成恢复向导、自动备份、自定义导出三个独立入口。<br>
  4. 救援、保留副本、重置配置统一收进「维护与恢复」，危险操作都有二次确认。<br>
  5. 备份记录从底部文本块改成可点开的记录列表。
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-term" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 10 3 2-3 2M12 15h5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const ic = (id, s = 22) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const chev = ic('i-chev', 18).replace('<svg', '<svg class="chev"');
  const esc = (v) => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- 模拟状态 ----------
  const S = {
    state: 'ok',
    running: null,          // { pct, step, timer }
    lastDone: false,
    auto: { on: true, mode: 'daily', time: '03:00', hours: 24 },
    restore: { step: 0, file: null, scope: { app: true, chat: true, settings: true, plugins: true, files: false }, pwd: '' },
    export: { scope: 0, key: false, projects: [] },
    retainedFilter: '全部',
    fileDir: ['工作目录'],
    stack: ['root'],
  };
  const copies = [
    { t: '今天 03:00', size: '412 MB', ok: true, plugin: false },
    { t: '昨天 03:00', size: '409 MB', ok: true, plugin: true },
    { t: '10-30 03:00', size: '398 MB', ok: true, plugin: false },
  ];
  const backupFiles = [
    { name: 'DSHA-data-v5-7f3a…c21e.tar.gz', t: '今天 18:12', size: '418 MB', enc: false },
    { name: 'DSHA-data-v5-19b0…9e04.tar.gz', t: '10-28 21:40', size: '402 MB', enc: false },
    { name: 'DSHA-backup-2026-09-12.dsha', t: '09-12 10:05', size: '355 MB', enc: true },
  ];

  const stateInfo = {
    ok:      { cls: '',     icon: 'i-shield',   title: '数据已保护', sub: '最近一次手动备份在 2 小时前，自动副本已按计划完成。', last: '今天 18:12', list: '已保护 · 2 小时前' },
    stale:   { cls: 'warn', icon: 'i-shield-x', title: '已有 9 天没有手动备份', sub: '自动副本只存在本机私有目录。换机或卸载前，请导出一份到手机存储。', last: '10-23 21:05', list: '9 天未备份' },
    never:   { cls: 'warn', icon: 'i-shield-x', title: '还没有导出过备份', sub: '对话、配置和插件目前只存在应用内。建议先做一次一键备份。', last: '从未', list: '尚未备份' },
    failed:  { cls: 'err',  icon: 'i-shield-x', title: '上次备份未完成', sub: '保存位置空间不足，原数据未改动。清理空间后可以重新备份。', last: '10-29 22:10（失败）', list: '上次失败' },
    pending: { cls: 'err',  icon: 'i-wrench',   title: '有未完成的环境维护', sub: '原环境尚未确认，备份和恢复暂不可用。请先恢复中断的维护。', last: '今天 18:12', list: '需要处理' },
  };
  const blocked = () => S.state === 'pending' || !!S.running;

  // ---------- 通用片段 ----------
  const row = ({ go, act, icon, t, s, meta, tone, dis }) =>
    `<button class="row" ${go ? `data-go="${go}"` : ''} ${act ? `data-action="${act}"` : ''} ${dis ? 'disabled' : ''}>
      <span class="ic ${tone || ''}">${ic(icon)}</span>
      <span class="tx"><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</span>
      ${meta ? `<span class="meta">${meta}</span>` : ''}${chev}</button>`;
  const titles = {
    root: '数据与备份', backup: '一键备份', restore: '从备份恢复', auto: '自动备份', export: '自定义导出',
    storage: '存储与文件', files: '作品与文件导出', skills: '技能（Skills）', guide: '储存指南',
    rescue: '救援与维护工具', retained: '保留副本与旧环境', history: '备份与维护记录',
  };
  const head = (icon, title, sub) => {
    const crumbs = S.stack.slice(0, -1).map((p, i) =>
      `<button data-back="${i}">${i === S.stack.length - 2 ? ic('i-back', 16) : ''}${titles[p]}</button><span aria-hidden="true">/</span>`).join('');
    return `${S.stack.length > 1 ? `<nav class="crumb" aria-label="路径">${crumbs}<span>${titles[S.stack.at(-1)]}</span></nav>` : ''}
      <div class="page-head"><div class="big-ic">${ic(icon, 30)}</div><h2>${title}</h2></div>
      <p class="page-sub">${sub}</p>`;
  };

  // ---------- 页面：首页 ----------
  function heroHtml() {
    if (S.running) {
      const steps = ['安全停止 DSH 与运行任务', '打包对话、配置与插件', '写入 下载/DSHA', '完整性核验'];
      return `<section class="hero" aria-label="备份进行中">
        <div class="hero-top"><div class="shield run">${ic('i-up', 26)}</div>
          <div style="flex:1"><h3>正在备份 · ${S.running.pct}%</h3><div class="muted" style="font-size:14px">${steps[S.running.step]}… 请勿关闭应用。</div></div></div>
        <div class="progress" role="progressbar" aria-valuenow="${S.running.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${S.running.pct}%"></i></div>
        <ul class="steps">${steps.map((x, i) => `<li class="${i < S.running.step ? 'done' : i === S.running.step ? 'cur' : ''}"><span class="dot"></span>${x}</li>`).join('')}</ul>
        <div class="btns"><button class="btn danger" data-action="cancel-backup">取消备份</button></div></section>`;
    }
    const i = stateInfo[S.state];
    const auto = S.auto.on ? (S.auto.mode === 'daily' ? `每天 ${S.auto.time}` : S.auto.mode === 'interval' ? `每 ${S.auto.hours} 小时` : '停止 DSH 后') : '已关闭';
    const doneBanner = S.lastDone ? `<div class="notice" style="background:var(--ok-bg);color:var(--ok);margin-bottom:14px">${ic('i-shield', 18)}<span>备份完成并已核验：DSHA-data-v5-a41c…77d2.tar.gz · 421 MB，保存在 下载/DSHA。</span></div>` : '';
    const primary = S.state === 'pending'
      ? `<button class="btn primary" data-go="rescue">${ic('i-wrench', 18)}恢复中断维护</button>`
      : `<button class="btn primary" data-go="backup">${ic('i-up', 18)}立即备份</button>`;
    return `<section class="hero" aria-label="备份状态">${doneBanner}
      <div class="hero-top"><div class="shield ${i.cls}">${ic(i.icon, 26)}</div>
        <div style="flex:1"><h3>${i.title}</h3><div class="muted" style="font-size:14px;line-height:1.6">${i.sub}</div></div></div>
      <div class="hero-stats">
        <button class="stat" data-go="history" style="border:0;text-align:left;cursor:pointer"><span class="cap">最近手动备份</span><b>${S.lastDone ? '刚刚' : i.last}</b></button>
        <button class="stat" data-go="auto" style="border:0;text-align:left;cursor:pointer"><span class="cap">自动备份</span><b>${auto}</b></button>
        <div class="stat"><span class="cap">保存位置</span><b>下载/DSHA</b></div>
      </div>
      <div class="btns full">${primary}<button class="btn" data-go="restore" ${S.state === 'pending' ? 'disabled' : ''}>${ic('i-restore', 18)}从备份恢复</button></div></section>`;
  }
  function viewRoot() {
    const d = blocked();
    return head('i-folder', '数据与备份', '导出、恢复与文件共享。') + heroHtml() +
      `<div class="section-label">${ic('i-up', 18)}备份选项</div><div class="group">
        ${row({ go: 'auto', icon: 'i-clock', t: '自动备份', s: '备份时机 · 本机保留最近 3 份已验证副本', meta: S.auto.on ? '已开启' : '已关闭' })}
        ${row({ go: 'export', icon: 'i-sliders', t: '自定义导出', s: '选择范围 · 项目目录 · 是否包含 API Key', dis: d })}
        ${row({ go: 'history', icon: 'i-history', t: '备份与维护记录', s: '手动备份、自动副本和维护结果' })}
      </div>
      <div class="section-label">${ic('i-folder', 18)}存储与文件</div><div class="group">
        ${row({ go: 'storage', icon: 'i-disk', t: '存储与文件', s: '空间占用、缓存清理和文件共享', meta: '3.8 GB' })}
        ${row({ go: 'files', icon: 'i-file', t: '作品与文件导出', s: '浏览工作区 · 保存到手机 · 分享' })}
        ${row({ go: 'skills', icon: 'i-spark', t: '技能（Skills）', s: '查看技能 · 导入 SKILL.md', meta: '4 个' })}
      </div>
      <div class="section-label">${ic('i-wrench', 18)}维护与恢复</div><div class="group">
        ${row({ go: 'guide', icon: 'i-book', t: '储存指南', s: '数据位置 · 导出备份 · 恢复与清理' })}
        ${row({ go: 'retained', icon: 'i-archive', t: '保留副本与旧环境', s: '旧环境、插件原件和隔离项，不自动删除', meta: '7 项' })}
        ${row({ go: 'rescue', icon: 'i-wrench', t: '救援与维护工具', s: '只读救援导出 · 恢复中断提交 · 回退运行时', tone: S.state === 'pending' ? 'err' : '' })}
        ${row({ act: 'reset', icon: 'i-reset', t: '重置配置', s: '保留原件，插件、对话和凭据不受影响', tone: 'warn', dis: d })}
      </div>`;
  }

  // ---------- 一键备份确认 ----------
  function viewBackup() {
    return head('i-up', '一键备份', '无需密码，直接保存为 tar.gz，可在新设备上恢复。') +
      `<div class="card" style="margin-top:18px"><div class="incl">
        <div><span class="badge ok">会包含</span><ul><li>对话与附件</li><li>运行配置与 profile 设置</li><li>已安装插件（系统插件除外）</li><li>当前应用内工作区</li></ul></div>
        <div><span class="badge gray">不包含</span><ul><li>原生 API Key（可在自定义导出中勾选）</li><li>外置工作区，请另行备份</li><li>可再生缓存与 Ubuntu 运行环境</li><li>桥 token 等本机凭据</li></ul></div>
      </div></div>
      <div class="card"><dl class="kv">
        <dt>保存到</dt><dd>下载/DSHA <span class="cap">（剩余 48.2 GB）</span></dd>
        <dt>文件名</dt><dd>DSHA-data-v5-&lt;UUID&gt;.tar.gz</dd>
        <dt>预计大小</dt><dd>约 420 MB</dd>
      </dl></div>
      <div class="notice" style="margin-top:12px">${ic('i-info', 18)}<span>备份时会安全停止 DSH Web、终端和写任务，完成后需手动重新启动。整个过程约 1–2 分钟。</span></div>
      <div class="btns full" style="margin-top:18px"><button class="btn" data-action="back">取消</button><button class="btn primary" data-action="start-backup" ${blocked() ? 'disabled' : ''}>开始备份</button></div>`;
  }

  // ---------- 恢复向导 ----------
  function viewRestore() {
    const r = S.restore, names = ['选择文件', '核验内容', '选择范围', '确认恢复'];
    const stepper = `<div class="stepper" aria-label="步骤">${names.map((n, i) => `<div class="${i < r.step ? 'done' : i === r.step ? 'on' : ''}">${i + 1}. ${n}</div>`).join('')}</div>`;
    let body = '';
    if (r.step === 0) {
      body = `<button class="drop" data-action="pick-file">${ic('i-file', 28)}<div style="margin-top:8px;font-weight:600">从手机选择备份文件</div><div class="cap">支持 .tar.gz 与旧版加密 .dsha</div></button>
        <div class="section-label">下载/DSHA 中找到的备份</div><div class="group">
        ${backupFiles.map((f, i) => `<button class="row" data-action="choose-file" data-i="${i}"><span class="ic">${ic(f.enc ? 'i-lock' : 'i-archive')}</span><span class="tx"><div class="t" style="font-size:14px">${f.name}</div><div class="s">${f.t} · ${f.size}${f.enc ? ' · 旧版加密，需要原密码' : ''}</div></span>${chev}</button>`).join('')}</div>`;
    } else if (r.step === 1) {
      const f = backupFiles[r.file];
      body = f.enc && !r.verified
        ? `<div class="card"><h3 style="margin:0 0 8px;font-size:16px">${ic('i-lock', 18)} 输入原备份密码</h3><p class="muted" style="font-size:14px;margin:0 0 12px">这是旧版加密备份，需要原密码完成认证后才能检查内容。</p>
            <label class="field" style="margin:0"><span>密码</span><input type="password" id="pwd" style="flex:1;width:auto" autocomplete="off"></label></div>
            <div class="btns full" style="margin-top:16px"><button class="btn" data-action="restore-prev">上一步</button><button class="btn primary" data-action="verify">核验</button></div>`
        : `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="word-break:break-all">${f.name}</b><span class="badge ok">${ic('i-shield', 14)}完整性通过</span></div>
            <dl class="kv" style="margin-top:14px"><dt>数据格式</dt><dd>v5 · 已完整核验</dd><dt>创建时间</dt><dd>${f.t}</dd>
            <dt>对话</dt><dd>128 个会话 · 附件 36 MB</dd><dt>设置</dt><dd>web profile、工作目录 .env</dd>
            <dt>插件</dt><dd>6 个 <span class="badge warn">1 个含受管脚本，将先隔离</span></dd><dt>工作区</dt><dd>212 MB</dd></dl></div>
          <div class="notice" style="margin-top:12px">${ic('i-info', 18)}<span>本机授权状态（Root、Shizuku、短信等）不会从备份生效，恢复后需在本机重新开启。</span></div>
          <div class="btns full" style="margin-top:16px"><button class="btn" data-action="restore-prev">上一步</button><button class="btn primary" data-action="restore-next">下一步</button></div>`;
    } else if (r.step === 2) {

  // ---------- 渲染与导航 ----------
  function render(scrollTop) {
    $('#view').innerHTML = views[S.stack.at(-1)]();
    $('#list-sub').textContent = S.running ? `正在备份 · ${S.running.pct}%` : stateInfo[S.state].list;

  const back = () => { if (S.stack.length > 1) S.stack.pop(); render(true); };
  const home = () => { S.stack = ['root']; render(true); };

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
  let lastFocus = null;
  function dialog(title, msg, actions) {
    lastFocus = document.activeElement;
    $('#dialog').innerHTML = `<h3 id="dlg-title">${title}</h3><p>${msg}</p><div class="btns">${actions.map((a, i) => `<button class="btn ${a.primary ? 'primary' : a.danger ? 'danger' : ''}" data-dlg="${i}">${a.label}</button>`).join('')}</div>`;
    $('#scrim').classList.add('show');
    $('#dialog').querySelectorAll('[data-dlg]').forEach(b => b.onclick = () => { closeDialog(); actions[+b.dataset.dlg].fn?.(); });
    $('#dialog').querySelector('.btn.primary, .btn.danger, .btn')?.focus();
  }
  function closeDialog() { $('#scrim').classList.remove('show'); lastFocus?.focus?.(); }
  const cancelBtn = { label: '取消' };

  function startBackup() {
    S.lastDone = false; S.running = { pct: 0, step: 0 }; home();
    S.running.timer = setInterval(() => {
      const r = S.running; if (!r) return;
      r.pct = Math.min(100, r.pct + 4); r.step = r.pct < 15 ? 0 : r.pct < 65 ? 1 : r.pct < 88 ? 2 : 3;
      if (r.pct >= 100) { clearInterval(r.timer); S.running = null; S.lastDone = true; S.state = 'ok'; $('#ctl-state').value = 'ok'; toast('备份完成并已核验'); }
      if (S.stack.at(-1) === 'root' || !S.running) render(false);
    }, 220);
  }

  const actions = {
    theme: () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? '' : 'dark'; },
    back, home,
    'start-backup': startBackup,
    'cancel-backup': () => dialog('取消备份？', '已写入的临时文件会被清理，原数据不受影响。', [{ label: '继续备份' }, { label: '取消备份', danger: true, fn: () => { clearInterval(S.running.timer); S.running = null; render(false); toast('已取消备份，原数据未改动'); } }]),
    reset: () => dialog('重置配置？', '先停止 Web、终端和写任务，在隔离服务中重置当前 web profile 的普通设置并读回，再事务提交与工作目录 .env。\n插件构成、对话和凭据保留；原配置可恢复。无法确认时保留原件并显示原因。', [cancelBtn, { label: '保留原件并重置', primary: true, fn: () => toast('配置已重置，原配置已保留快照') }]),
    'pick-file': () => actions['choose-file'](null, 0),
    'choose-file': (el, i) => { S.restore.file = el ? +el.dataset.i : i; S.restore.verified = false; S.restore.step = 1; render(true); },
    verify: () => { const v = $('#pwd')?.value || ''; if (!v) { toast('请输入原备份密码'); return; } S.restore.verified = true; render(false); },
    'restore-prev': () => { S.restore.step = Math.max(0, S.restore.step - 1); if (S.restore.step === 0) S.restore.verified = false; render(true); },
    'restore-next': () => { S.restore.step++; render(true); },
    'restore-run': () => dialog('恢复此备份？', '将停止 Web、终端和写任务，并在恢复前为当前数据生成私有快照。', [cancelBtn, { label: '恢复', primary: true, fn: () => { S.restore.step = 4; render(true); } }]),
    'auto-mode': (el) => { S.auto.mode = el.dataset.k; render(false); },
    'auto-now': () => toast('已开始创建自动备份'),
    'copy-restore': (el) => dialog('预检恢复', `将检查 ${copies[+el.dataset.i].t} 的自动副本，确认范围后才会恢复。`, [cancelBtn, { label: '开始预检', primary: true, fn: () => { S.stack.push('restore'); S.restore = { ...S.restore, file: 0, step: 1, verified: true }; render(true); } }]),
    'copy-export': () => toast('请选择保存位置，将导出无密码备份'),
    'pick-project': () => { S.export.projects.push(['DSH-A-mod', 'notes', 'blog'][S.export.projects.length % 3]); render(false); },
    locations: () => dialog('数据范围与位置', '应用数据：/data/data/…/files/linux\n对话与附件：~/.dsh/sessions\n设置：~/.dsh/config 与工作目录 .env\n插件：~/.dsh/plugins（系统插件不导出）\n导出位置：由你在系统选择器中指定', [{ label: '知道了', primary: true }]),
    'do-export': () => toast('请在系统选择器中选择保存位置'),
    clean: () => dialog('清理存储空间？', '将清理可再生缓存与多余运行时副本，约释放 420 MB。\n至少保留两份健康副本；修改过或含额外文件的原件不会删除。', [cancelBtn, { label: '开始清理', primary: true, fn: () => toast('清理完成，释放 418 MB') }]),
    toast: (el) => toast(el.dataset.msg || '预览：此处打开对应系统页面'),
    skill: (el) => dialog(el.dataset.n, el.dataset.m === 'true' ? '模型可按需调用 skill 工具读取。\n\n调用命令：/' + el.dataset.n : '此技能禁止模型自主调用，只能手动调用。\n\n调用命令：/' + el.dataset.n, [{ label: '复制调用命令', fn: () => toast('已复制') }, { label: '关闭', primary: true }]),
    'dlg-rescue-export': () => dialog('只读救援导出', '不启动 Ubuntu 或网页，只读取当前可读取的数据并导出为 tar.gz。无法读取的部分会在报告中列出。', [cancelBtn, { label: '选择保存位置', primary: true, fn: () => toast('请选择保存位置') }]),
    'dlg-reexport': () => { S.stack.push('auto'); render(true); },
    'dlg-recover': () => dialog('恢复中断的数据提交', '将先停止写任务，再根据宿主日志恢复一致状态。无需旧 Python 或备份密码，原件将保留。', [cancelBtn, { label: '继续', primary: true, fn: () => { if (S.state === 'pending') { S.state = 'ok'; $('#ctl-state').value = 'ok'; } render(false); toast('已恢复一致状态'); } }]),
    'dlg-home': () => dialog('选择要使用的数据目录', '会先停止 Web 和终端，再选择已有目录。两份数据都保留，不合并或清空。所选目录必须存在且可读取。', [cancelBtn, { label: '原容器数据目录', fn: () => toast('已切换到原容器数据目录') }, { label: '宿主持久数据目录', primary: true, fn: () => toast('已切换到宿主持久数据目录') }]),
    'dlg-rollback': () => dialog('回退兼容运行时？', '切回直接健康前代 dsh 0.2.1-rc.4。当前版本保留为原件，可再次切换。', [cancelBtn, { label: '回退', danger: true, fn: () => toast('已回退，请重新启动 DSH') }]),
    'retained-item': (el) => dialog(el.dataset.n, `类型：${el.dataset.k}\n原件或记录保持保留。\n检查、导出与恢复分别处理，操作前会重新核对文件摘要。`, [{ label: '关闭' }, { label: '检查此记录', primary: true, fn: () => toast('检查通过，摘要一致') }]),
  };

  // ---------- 事件委托 ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-go-replace],[data-action],[data-back],[data-filter],[data-open],[data-dir]');
    if (!t || t.disabled) return;
    if (t.dataset.go) { if (t.dataset.go === 'root') home(); else go(t.dataset.go); }
    else if (t.dataset.goReplace) { S.stack = ['root', t.dataset.goReplace]; render(true); }
    else if (t.dataset.back) { S.stack = S.stack.slice(0, +t.dataset.back + 1); render(true); }
    else if (t.dataset.filter) { S.retainedFilter = t.dataset.filter; render(false); }
    else if (t.dataset.open) { S.fileDir.push(t.dataset.open); render(false); }
    else if (t.dataset.dir) { S.fileDir = S.fileDir.slice(0, +t.dataset.dir + 1); render(false); }
    else actions[t.dataset.action]?.(t);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.scope) { S.restore.scope[t.dataset.scope] = t.checked; render(false); }
    else if (t.dataset.exp) { S.export.scope = +t.dataset.exp; render(false); }
    else if (t.id === 'exp-key') { S.export.key = t.checked; render(false); }
    else if (t.id === 'auto-on') { S.auto.on = t.checked; render(false); }
    else if (t.id === 'auto-time') { S.auto.time = t.value || '03:00'; render(false); }
    else if (t.id === 'auto-hours') { const v = +t.value; if (v >= 1 && v <= 168) { S.auto.hours = v; render(false); } else { toast('请输入 1–168'); t.value = S.auto.hours; } }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('#scrim').classList.contains('show')) closeDialog(); else if (S.stack.length > 1) back();
  });
  $('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') closeDialog(); });

  $('#ctl-device').onchange = (e) => $('#device').classList.toggle('phone', e.target.value === 'phone');
  $('#ctl-state').onchange = (e) => { S.state = e.target.value; S.lastDone = false; render(false); };
  $('#ctl-theme').onclick = actions.theme;
  $('#ctl-note').onclick = () => $('#note').classList.toggle('hidden');

  render(false);
})();
</script>
</body>
</html>

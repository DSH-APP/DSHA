name: Build Debug APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1：原生 arm64 预装 rootfs（node-pty 必须编 arm64）。
  # 不在这里装 Android SDK —— ARM runner 上 setup-android 会失败。
  bundle:
    name: Offline rootfs (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached offline bundle
        id: cache
        uses: actions/cache@v4
        with:
          path: bundle/offline-rootfs.tar.gz
          key: offline-rootfs-${{ hashFiles('scripts/offline-provision.sh', 'scripts/ci-make-offline-bundle.sh', 'scripts/provision-builtin-plugins.sh', 'app/src/main/assets/rootfs-confirm-install.sh', 'app/src/main/assets/webui-polyfill.sh', 'app/src/main/assets/webui-origin-port-patch.sh', 'app/src/main/assets/*.patch', 'app/src/main/assets/dsh-web-mobile/**', 'app/src/main/assets/device-shell-guide/**', 'app/src/main/assets/task-notifier/**', 'app/src/main/assets/status-overlay/**') }}

      - name: Build offline rootfs bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p bundle
          bash scripts/ci-make-offline-bundle.sh
          test -s bundle/offline-rootfs.tar.gz
          ls -lh bundle/offline-rootfs.tar.gz

# 离线包版本标记：**离线包内容的版本号，不是 dsh 的版本号**，取仓库根的 OFFLINE_VERSION。
# 什么时候 +1：改过 offline-provision.sh / ci-make-offline-bundle.sh /
# provision-builtin-plugins.sh 或内置插件资源（也就是上面 cache key 会变、包会重建）之后。
# 内容没变就别动它 —— 用户会白重解压 300MB；内容变了忘记加，用户就永远拿不到新环境。
# 历史：这个值从引入起一直是默认的 1（没人 bump 过），所以「发现新版内置环境」在线上
# 从未真正触发。2026-08-26 起改成读仓库里的文件，让「该 bump 了」这件事能在 diff 里
# 被看见、被 review，而不是藏在一个谁都想不起来的 env 默认值里。
# 只收纯整数：App 侧靠它比大小，混进 dsh-0.1.1-rc.2 这种格式就会判错 —— 真机上出过
# 「提示可解压更新、解压完反而降级」，见 OfflineVersion.java 开头那段。
# 本地打包（tools/pack-local.sh）一律写 0 —— 本地包的内容不由这里管，写 0 就不会误弹。
# 缓存命中时也要生成（缓存只存 tar.gz，version 需每次生成）。
      - name: Write offline version
        run: |
          set -euo pipefail
          VER="${OFFLINE_VERSION:-$(tr -d ' \n\r' < OFFLINE_VERSION)}"
          case "$VER" in ''|*[!0-9]*) echo "OFFLINE_VERSION 必须是纯整数，实际：'$VER'" >&2; exit 1 ;; esac
          printf '%s\n' "$VER" > bundle/offline-rootfs.version
          echo "offline-rootfs.version=$VER"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: |
            bundle/offline-rootfs.tar.gz
            bundle/offline-rootfs.version
          if-no-files-found: error
          retention-days: 14

  # Job 2：x86 runner 打 APK（官方 aapt2 只有 x86_64）
  apk:
    name: Assemble debug APK
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download offline bundle
        uses: actions/download-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: bundle

      - name: Bundle asset into app
        run: |
          set -euo pipefail
          test -s bundle/offline-rootfs.tar.gz
          mkdir -p app/src/main/assets
          cp bundle/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.tar.gz
          # 离线包版本标记（App 启动时对比 rootfs 已解压版本，发现新版提示升级）
          if [ -f bundle/offline-rootfs.version ]; then
            cp bundle/offline-rootfs.version app/src/main/assets/offline-rootfs.version
          fi
          ls -lh app/src/main/assets/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare shared signing key (optional)
        env:
          KS_B64: ${{ secrets.DSHA_KEYSTORE_B64 }}
          KS_PWD: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DSHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 没配 secret 时保持原样（AGP 默认 debug keystore），只是包与旧版签名不同、
          # 用户升级要卸载重装；配了就所有构建共用一把，覆盖安装无缝。
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/dsha.keystore"
            echo "DSHA_KEYSTORE=$RUNNER_TEMP/dsha.keystore" >> "$GITHUB_ENV"
            echo "DSHA_KEYSTORE_PASSWORD=${KS_PWD:-android}" >> "$GITHUB_ENV"
            # 默认值必须是 dsha —— 项目 release keystore 的 alias 就是它
            # （build.gradle 里同名默认）。写成 androiddebugkey 的话，
            # 少配这一个 secret 就会「keystore 有、alias 找不到」而签名失败。
            echo "DSHA_KEY_ALIAS=${KS_ALIAS:-dsha}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_PASSWORD=${KEY_PWD:-android}" >> "$GITHUB_ENV"
            echo "已启用统一签名（与历史发布包一致，可直接覆盖安装）"
          else
            echo "未配置 DSHA_KEYSTORE_B64：使用默认 debug 签名（升级可能需要卸载重装）"
          fi

      - name: Build debug APK
        run: |
          set -euo pipefail
          # CI 是 x86_64：去掉仅适用于本地 ARM64 的 aapt2 覆盖
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Report signing fingerprint
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$OUT" | grep -i "SHA-256 digest" || true
          # 与线上发布密钥比对。这条流水线的产物只是 artifact、不对外发布，所以不阻断；
          # 但指纹不一致时这个包装不到已装正式版的设备上（Android 只允许同签名覆盖），
          # 拿去验机会白折腾一趟，值得在日志里说清楚。
          # apksigner 打印的是**不带冒号的小写十六进制**，而 keytool 打印的是带冒号
          # 的大写 —— 原来直接拿带冒号的常量去 grep apksigner 的输出，永远匹配不上。
          # 这也是「指纹核对一直在 warning」的第二个原因（第一个是期望值填错了密钥）。
          # 统一去冒号 + 转小写再比，两种格式都能命中。
          if ! echo "$OUT" | tr -d ':' | tr 'A-Z' 'a-z' \
               | grep -q "e7e3a31a75946f2669194c972b3dd0c9a"; then
            echo "::warning::此 artifact 的签名与线上发布密钥不同，无法覆盖安装到已装正式版的设备（只能卸载重装，rootfs 会丢）。"
          else
            echo "签名与线上发布密钥一致，可直接覆盖安装"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

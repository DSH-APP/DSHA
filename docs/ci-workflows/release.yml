name: Release

# 打 tag 就发布：构建离线 rootfs → 打签名 APK → 建 GitHub Release 并上传。
#
# 为什么单独一个工作流而不是往 android-build.yml 里加条件：
# 那个流水线每次 push main 都跑，职责是「代码能编过、产物能下载」；
# 发布是低频、有副作用（创建 Release、对外可见）的动作，混在一起容易误触发。
# 两边共用同一套构建脚本（scripts/ci-make-offline-bundle.sh + gradle），
# 不复制构建逻辑本身。
#
# 触发方式：
#   git tag v1.1.7 && git push origin v1.1.7
#   或在 Actions 页手动 workflow_dispatch，填 tag 名
#
# 必需的 secrets（没配就用 debug 签名，会在日志里大声警告）：
#   DSHA_KEYSTORE_B64        base64 编码的 release keystore
#   DSHA_KEYSTORE_PASSWORD   keystore 密码
#   DSHA_KEY_ALIAS           key 别名
#   DSHA_KEY_PASSWORD        key 密码

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.1.7）；留空则用当前 commit 建 tag'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # 发布不该被后一次触发打断

permissions:
  contents: write                # 创建 Release、上传附件需要
  id-token: write                # 构建证明（attestation）签发需要
  attestations: write            # 把证明写回仓库的 attestation 存储

jobs:
  # Job 1：原生 arm64 预装 rootfs（node-pty 必须编 arm64）
  bundle:
    name: Offline rootfs (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached offline bundle
        id: cache
        uses: actions/cache@v4
        with:
          path: bundle/offline-rootfs.tar.gz
          key: offline-rootfs-${{ hashFiles('scripts/offline-provision.sh', 'scripts/ci-make-offline-bundle.sh', 'scripts/provision-builtin-plugins.sh', 'app/src/main/assets/rootfs-confirm-install.sh', 'app/src/main/assets/webui-polyfill.sh', 'app/src/main/assets/webui-origin-port-patch.sh', 'app/src/main/assets/*.patch', 'app/src/main/assets/dsh-web-mobile/**', 'app/src/main/assets/device-shell-guide/**', 'app/src/main/assets/task-notifier/**', 'app/src/main/assets/status-overlay/**') }}

      - name: Build offline rootfs bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p bundle
          bash scripts/ci-make-offline-bundle.sh
          test -s bundle/offline-rootfs.tar.gz
          ls -lh bundle/offline-rootfs.tar.gz

      # 离线包内容的版本号（不是 dsh 版本号），取仓库根的 OFFLINE_VERSION。
      # 改过 provision 相关脚本或内置插件资源之后把它 +1，用户才会收到「发现新版内置
      # 环境」；内容没变别动它，否则用户白重解压 300MB。只收纯整数 —— App 侧靠它比
      # 大小，混进 dsh-0.1.1-rc.2 这种格式会判错（真机上出过「提示可更新、解压完反而
      # 降级」）。完整说明在 android-build.yml 同名步骤上方。
      - name: Write offline version
        run: |
          set -euo pipefail
          VER="${OFFLINE_VERSION:-$(tr -d ' \n\r' < OFFLINE_VERSION)}"
          case "$VER" in ''|*[!0-9]*) echo "OFFLINE_VERSION 必须是纯整数，实际：'$VER'" >&2; exit 1 ;; esac
          printf '%s\n' "$VER" > bundle/offline-rootfs.version
          echo "offline-rootfs.version=$VER"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: |
            bundle/offline-rootfs.tar.gz
            bundle/offline-rootfs.version
          if-no-files-found: error
          retention-days: 7

  # Job 2：x86 runner 打签名 APK 并发布
  release:
    name: Build signed APK & publish
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download offline bundle
        uses: actions/download-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: bundle

      - name: Bundle asset into app
        run: |
          set -euo pipefail
          test -s bundle/offline-rootfs.tar.gz
          mkdir -p app/src/main/assets
          cp bundle/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.tar.gz
          if [ -f bundle/offline-rootfs.version ]; then
            cp bundle/offline-rootfs.version app/src/main/assets/offline-rootfs.version
          fi
          ls -lh app/src/main/assets/offline-rootfs.tar.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # 签名密钥从 secrets 落地成临时文件。绝不写进工作区（那会被后续步骤
      # 或缓存意外带走），只放 RUNNER_TEMP，job 结束即销毁。
      - name: Prepare release signing key
        env:
          KS_B64: ${{ secrets.DSHA_KEYSTORE_B64 }}
          KS_PWD: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DSHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::未配置 DSHA_KEYSTORE_B64 —— 发布包不能用 debug 签名"
            echo "debug keystore 的密码是公开的（android/android），"
            echo "谁都能用它签出「看起来是官方更新」的包。"
            echo "请到 Settings → Secrets and variables → Actions 配置四个 secret。"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/dsha.keystore"
          test -s "$RUNNER_TEMP/dsha.keystore"
          echo "DSHA_KEYSTORE=$RUNNER_TEMP/dsha.keystore" >> "$GITHUB_ENV"
          echo "DSHA_KEYSTORE_PASSWORD=$KS_PWD" >> "$GITHUB_ENV"
          echo "DSHA_KEY_ALIAS=${KS_ALIAS:-dsha}" >> "$GITHUB_ENV"
          echo "DSHA_KEY_PASSWORD=$KEY_PWD" >> "$GITHUB_ENV"
          echo "已加载 release keystore"

      - name: Read version from build.gradle
        id: ver
        run: |
          set -euo pipefail
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          VC=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle | head -1)
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN versionCode=$VC"

      - name: Build signed release APK
        run: |
          set -euo pipefail
          # CI 是 x86_64：去掉仅适用于本地 ARM64 的 aapt2 覆盖
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 指纹必须核对：发布前确认签名没换，否则老用户无法覆盖升级。
      # 这一步失败就停下，不要发出一个签名不对的包。
      - name: Verify signing fingerprint
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$OUT" | grep -i "SHA-256 digest" || true
          # 线上包实际使用的发布证书指纹（前 16 字节即可唯一）。
          #
          # 比对前统一去冒号 + 转小写：apksigner 打印的是不带冒号的小写十六进制，
          # keytool 打印的是带冒号的大写 —— 原来直接拿带冒号的常量去 grep
          # apksigner 的输出，**永远匹配不上**。这是「指纹核对一直在 warning」的
          # 第二个原因，第一个是期望值填的是另一把钥匙（见下）。
          #
          # 这里原来填 ED:8A:AE:A2:07:F5:1B:F1（项目 release keystore），于是
          # 从 v1.1.7 起每次构建都 warning —— 因为 secret DSHA_KEYSTORE_B64 里
          # 存的其实是一份 debug keystore（alias androiddebugkey，e7e3a31a…），
          # 当初设 secret 时传错了文件。设成不阻断，这条噪声就一直没人看。
          #
          # 已发布的 v1.1.7 用的就是这份密钥，用户手上的包也是它签的。Android 只允许
          # 同签名覆盖安装，换密钥等于逼所有人卸载重装（rootfs 在私有目录，卸载即丢），
          # 所以现在**以线上实际密钥为准**，密钥轮换（v3 rotation）单独排期处理。
          # 详见工作区 DSHA-签名现状与风险.md。
          #
          # 期望值改对之后，不匹配就意味着真出事了（secret 被换/丢失、或者退回了
          # 每次新生成的 debug keystore）—— 那样签出来的包用户根本装不上，
          # 发出去比发布失败糟得多。所以从 warning 改成直接 fail。
          if ! echo "$OUT" | tr -d ':' | tr 'A-Z' 'a-z' \
               | grep -q "e7e3a31a75946f2669194c972b3dd0c9a"; then
            echo "::error::证书指纹与线上发布密钥不一致 —— 这个包用户装不上（无法覆盖安装），已中止发布。请核对 secret DSHA_KEYSTORE_B64。"
            exit 1
          fi
          echo "签名指纹核对通过（与线上发布密钥一致）"

      - name: Rename APK
        id: apk
        run: |
          set -euo pipefail
          NAME="deepseekharness-arm64-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      # 构建证明：让任何人都能验证这个 APK 确实是本仓库这个 tag 的 CI 产出，
      # 而不是别人重打包的同名文件。sha256 只能证明「文件没被改过」，证明不了来源 ——
      # 而我们的分发方式恰恰是「从 GitHub 下 APK 手动侧载」，来源是最需要被证明的一环。
      #
      #   gh attestation verify deepseekharness-arm64-vX.Y.Z.apk --repo qiannianhuanxiang/DSHA
      #
      # 这条不阻断发布：老版本 runner 或权限缺失时只是没有证明，不该因此发不出包。
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.apk.outputs.file }}

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v${{ steps.ver.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: DSHA ${{ steps.tag.outputs.value }}
          # tag 里带连字符（-rc1 / -fix 之类）一律当预发布：GitHub 的
          # releases/latest 会跳过预发布，所以既能发出去给人验机，又不会被
          # 客户端的更新检查推给所有用户。手滑打错 tag 也不会误发正式版。
          prerelease: ${{ inputs.prerelease || contains(steps.tag.outputs.value, '-') }}
          # 显式写 false：这个 tag 指向 dev/1.1.x 而不是默认分支，v1.1.10 那次
          # 就被创建成了草稿 —— 草稿不出现在 releases 列表也不算 latest，
          # 等于「构建成功、CI 全绿、用户什么也下载不到」，而且没有任何报错提示。
          draft: false
          make_latest: ${{ !(inputs.prerelease || contains(steps.tag.outputs.value, '-')) }}
          generate_release_notes: true
          body: |
            **仅支持 arm64 / Android 8.0+**，APK 已内置完整 Linux 环境。

            ```
            versionName  ${{ steps.ver.outputs.name }}
            versionCode  ${{ steps.ver.outputs.code }}
            sha256       ${{ steps.apk.outputs.sha }}
            ```

            由 CI 构建并用项目 release keystore 签名，可直接覆盖安装。

            **面向用户的变化见 [CHANGELOG.md](https://github.com/qiannianhuanxiang/DSHA/blob/main/CHANGELOG.md)。**
            下面那份是 GitHub 自动生成的 —— 它只列 PR，而这个项目绝大多数改动是直接 push 的，
            所以那份看起来会比实际少得多（v1.1.9 有 102 个提交，自动记录里只有 1 条）。
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          fail_on_unmatched_files: true

      - name: 同步覆盖到 v1.1.9 Release（同一份 code 100 的包）
        # 1.1.9 首发那天覆盖过一次（code 98 → 99），说明「两个 Release 挂不同包」会让
        # 人下到旧版还不自知。现在要求两个入口都指向同一份修复版 —— 已装 1.1.9 的用户
        # 在 Releases 页点 v1.1.9 拿到的也必须是 code 100 的包（versionName 1.1.9.1，
        # 可覆盖安装）。产物就是上一轮 `build` 输出的 APK，不必重新构建。
        # 只有正式版（不含连字符）才同步；rc/预发布本来就是给人试的，不动老的。
        if: ${{ !contains(steps.tag.outputs.value, '-') && steps.ver.outputs.code >= 100 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.file }}"
          gh release upload v1.1.9 "$APK" --repo qiannianhuanxiang/DSHA --clobber
          gh release upload v1.1.9 "$APK.sha256" --repo qiannianhuanxiang/DSHA --clobber
          echo "已把 $APK 覆盖到 v1.1.9 Release（与 ${{ steps.tag.outputs.value }} 同一份）"

name: DSHA input handoff
description: 下载同一 run 内 inputs 节点的交接 artifact，按清单与 commit 核验后写入工作区。
inputs:
  artifact:
    description: Handoff artifact name produced by _node-inputs.yml
    required: true
  fixture:
    description: Also prepare the verified raw/managed host-test runtime fixture
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/dsha-handoff
    - name: Verify and unpack handoff
      shell: bash
      run: python3 tools/ci-handoff.py unpack --dir "$RUNNER_TEMP/dsha-handoff"
    - name: Verify restored runtime descriptor
      shell: bash
      run: python3 tools/verify-runtime-descriptor-source.py
    - name: Prepare current verified runtime fixture
      if: inputs.fixture == 'true'
      shell: bash
      run: python3 tools/prepare-test-runtime.py

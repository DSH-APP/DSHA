name: UI preview APK
# Skips offline rootfs / dsh-runtime assets. The APK is only for looking at UI and cannot enter DSH.
on:
  push:
    branches:
      - ui/redesign-v2
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Android SDK and standardDebug APK without offline assets
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          # Runner 镜像的 PATH 不一定带 sdkmanager，按 ANDROID_HOME 定位
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkm="$(command -v sdkmanager || true)"
          if [ -z "$sdkm" ]; then
            for c in "$sdk_root"/cmdline-tools/latest/bin/sdkmanager "$sdk_root"/cmdline-tools/*/bin/sdkmanager "$sdk_root"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then sdkm="$c"; break; fi
            done
          fi
          if [ -z "$sdkm" ]; then echo "sdkmanager not found under $sdk_root" >&2; ls -la "$sdk_root" >&2 || true; exit 1; fi
          echo "sdkmanager: $sdkm"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" "platforms;$platform" "build-tools;$buildtools"
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug \
            -x :app:prepareStandardAssets \
            -x :app:prepareRecoveryAssets \
            -x :app:prepareBackupAssets \
            -x :app:prepareRuntimeDescriptor \
            --no-daemon --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UI-PREVIEW-NOT-FOR-PRODUCTION
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 7

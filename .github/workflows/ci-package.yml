name: Complete unsigned package checks

# 节点图：
#   inputs（只还原、不重建运行时）─┬─► native-repro（描述符字节、第三方声明、原生可复现）
#                                  └─► package（verify-stability --stage package 的单一回执）
# package 节点保持一次完整回执：单测 / Lint / 资产 / 包检查共享同一源码快照，
# 由 tools/verify-ci-package.py 按 run 路径与 commit 复核。
on:
  workflow_dispatch:
    inputs:
      asset_bundle_url:
        description: Immutable HTTPS offline input bundle generated by tools/ci-assets.py
        required: true
        type: string
      asset_bundle_sha256:
        description: Fixed SHA-256 for that input bundle
        required: true
        type: string
      asset_archive_format:
        description: Layout of the verified input archive
        required: false
        type: choice
        default: bundle
        options: [bundle, source-archive]
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      asset_bundle_url: ${{ inputs.asset_bundle_url }}
      asset_bundle_sha256: ${{ inputs.asset_bundle_sha256 }}
      asset_archive_format: ${{ inputs.asset_archive_format }}
      rebuild_runtime: false
      artifact: package-inputs
  native-repro:
    name: Descriptor bytes, notices and native reproducibility
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'true'
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
      - name: Full descriptor bytes, notices and native reproducibility
        run: |
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          python3 tools/prepare-runtime-descriptor.py --check
          python3 tools/generate-third-party-notices.py --check
          python3 tools/check-third-party-notices.py --archive app/src/main/assets/dsh-runtime.bin
          python3 tools/native-session/build.py --ndk "$ANDROID_HOME/ndk/$ndk" --check
  package:
    name: Complete Standard unit, lint, assets and package checks
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 'true'
      - uses: ./.github/actions/restore-handoff
        with:
          artifact: ${{ needs.inputs.outputs.artifact }}
          fixture: 'true'
      - name: Complete Standard unit, lint, assets and package checks without signing secrets
        run: python3 tools/verify-stability.py --stage package --flavors standard --java-home "$JAVA_HOME" --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: UNSIGNED-NOT-FOR-INSTALLATION
          path: |
            app/build/outputs/apk/standard/release/*-unsigned.apk
            app/build/stability-acceptance
          if-no-files-found: error
          retention-days: 14

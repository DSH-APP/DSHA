name: Complete unsigned package checks
on:
  workflow_dispatch:
    inputs:
      asset_bundle_url:
        description: Immutable HTTPS offline input bundle generated by tools/ci-assets.py
        required: true
        type: string
      asset_bundle_sha256:
        description: Fixed SHA-256 for that input bundle
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Restore exact offline inputs
        env:
          INPUT_URL: ${{ inputs.asset_bundle_url }}
          INPUT_SHA: ${{ inputs.asset_bundle_sha256 }}
        run: python3 tools/ci-assets.py --url "$INPUT_URL" --sha256 "$INPUT_SHA"
      - name: Android SDK
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          sdkmanager "platforms;$platform" "build-tools;$buildtools" "ndk;$ndk"
      - name: Full descriptor bytes, notices and native reproducibility
        run: |
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          python3 tools/prepare-runtime-descriptor.py --check
          python3 tools/generate-third-party-notices.py --check
          python3 tools/check-third-party-notices.py --archive app/src/main/assets/dsh-runtime.bin
          python3 tools/native-session/build.py --ndk "$ANDROID_HOME/ndk/$ndk" --check
      - name: Current verified host runtime fixture
        run: python3 tools/prepare-test-runtime.py
      - name: Complete unit, lint, assets and package checks without signing secrets
        run: python3 tools/verify-stability.py --stage package --java-home "$JAVA_HOME" --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: UNSIGNED-NOT-FOR-INSTALLATION
          path: |
            app/build/outputs/apk/*/release/*-unsigned.apk
            app/build/stability-acceptance
          if-no-files-found: error
          retention-days: 14

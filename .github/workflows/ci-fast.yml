name: Source checks

# 节点图：
#   contracts ─┐
#   java-format┤  （互不依赖，立即并行）
#   inputs ────┼─► unit-source（源码模式单测，最多五个外部夹具跳过）
#              └─► host-fast（fast 阶段宿主回归，含 raw 夹具与 toolchains）
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    uses: ./.github/workflows/_node-contracts.yml
  java-format:
    uses: ./.github/workflows/_node-java-format.yml
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
  unit-source:
    needs: inputs
    uses: ./.github/workflows/_node-unit-tests.yml
    with:
      mode: source-only
      handoff: ${{ needs.inputs.outputs.artifact }}
      sunset_test: false
      forks: 2
      artifact: source-unit-results
  host-fast:
    needs: inputs
    uses: ./.github/workflows/_node-host-tests.yml
    with:
      stage: fast
      handoff: ${{ needs.inputs.outputs.artifact }}
      toolchains: true
      artifact: source-regressions

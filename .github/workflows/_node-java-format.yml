name: "Node: Java formatting"

# 可复用节点：完整 Java 格式门禁；失败时列出需要格式化的文件。
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out (defaults to the caller's commit)
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  java-format:
    name: Verify complete Java formatting gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Verify complete Java formatting gate
        run: |
          python3 - <<'PYCODE'
          import json, subprocess, sys
          from pathlib import Path
          result = subprocess.run(['python3', 'tools/format-java-tree.py', '--check'])
          summary = Path('app/build/java-format/tree-summary.json')
          if result.returncode and summary.is_file():
              for report in json.loads(summary.read_text())['reports']:
                  for row in json.loads((summary.parent / report).read_text())['files']:
                      if row['needsFormatting']:
                          print('NEEDS_FORMAT ' + row['file'], flush=True)
          sys.exit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: java-format-reports
          path: app/build/java-format
          if-no-files-found: warn
          retention-days: 7
